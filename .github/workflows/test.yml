name: Conformance contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest -v
      - run: python verify_result.py examples/result.json
      - run: python -m json.tool result.schema.json >/dev/null
